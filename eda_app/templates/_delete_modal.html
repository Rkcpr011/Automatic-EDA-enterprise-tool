<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form method="post" id="deleteForm">
      <div class="modal-header"><h5 class="modal-title">Delete report?</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <p class="mb-1">You are about to delete <strong id="deleteTitle"></strong>.</p>
        <p class="text-muted small mb-0">The uploaded file, the report and the cleaned datasets will be permanently removed.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-danger">Delete</button>
      </div>
    </form>
  </div></div>
</div>
